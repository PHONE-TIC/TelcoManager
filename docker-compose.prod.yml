# Surcharge de production pour TelcoManager
# À utiliser avec: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    volumes:
      - /opt/phonetic_telco-manager/data/db:/var/lib/postgresql/data

  caddy:
    volumes:
      - /opt/phonetic_telco-manager/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
