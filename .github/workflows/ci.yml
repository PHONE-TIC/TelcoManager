name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        working-directory: webapp
        run: npm ci
      - name: Run linter
        working-directory: webapp
        run: npm run lint
      - name: Build and Typecheck
        working-directory: webapp
        run: npm run build
      - name: Run Vitest tests
        working-directory: webapp
        # --run force le mode single-pass : sans lui, vitest resterait en watch
        # si la détection d'environnement CI venait à échouer.
        run: npm test -- --run

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Build and Typecheck
        working-directory: backend
        run: npm run build
      - name: Run Vitest tests
        working-directory: backend
        run: npm test -- --run

  test-backend-integration:
    runs-on: ubuntu-latest

    # Base éphémère dédiée : les tests d'intégration la vident entre chaque cas.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: stock_user
          POSTGRES_PASSWORD: stock_password
          POSTGRES_DB: telcomanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://stock_user:stock_password@localhost:5432/telcomanager_test?schema=public
      JWT_SECRET: integration-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Run integration tests
        working-directory: backend
        # Monte l'application Express complète : routage, validation et
        # middlewares d'autorisation sont traversés pour de vrai.
        run: npm run test:integration

